<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHubユーザー検索</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 px-4 py-12 text-slate-800">
  <main class="mx-auto max-w-xl">
    <header class="mb-8 text-center">
      <p class="mb-3 text-sm font-bold tracking-widest text-indigo-600">
        GITHUB USER FINDER
      </p>
      <h1 class="text-2xl font-bold sm:text-3xl">
        GitHubユーザー検索
      </h1>
      <p class="mt-3 text-sm text-slate-500">
        ユーザー名を入力して、プロフィールを見てみよう。
      </p>
    </header>

    <section
      aria-label="ユーザー検索"
      class="rounded-2xl bg-white p-6 shadow-md sm:p-8"
    >
      <form id="search-form" novalidate>
        <label for="username" class="mb-2 block text-sm font-bold">
          GitHubユーザー名
        </label>

        <div class="flex flex-col gap-3 sm:flex-row">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="例：octocat"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
            aria-describedby="message"
            class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          >

          <button
            id="search-button"
            type="submit"
            class="shrink-0 cursor-pointer rounded-lg bg-indigo-600 px-6 py-3 font-bold text-white transition hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-600 disabled:cursor-wait disabled:opacity-60"
          >
            検索する
          </button>
        </div>
      </form>

      <!-- 読み込み状況やエラーメッセージ -->
      <p
        id="message"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        class="mt-4 text-sm text-slate-500"
      >
        検索すると、ここに結果が表示されます。
      </p>
    </section>

    <!-- データ取得に成功したときだけ表示 -->
    <section
      id="user-card"
      aria-labelledby="display-name"
      hidden
      class="mt-6 rounded-2xl bg-white p-6 shadow-md sm:p-8"
    >
      <div class="flex flex-col items-center gap-4 text-center">
        <img
          id="avatar"
          alt=""
          width="112"
          height="112"
          class="h-28 w-28 rounded-full border-4 border-indigo-100 object-cover"
        >

        <div class="min-w-0 w-full">
          <h2
            id="display-name"
            class="break-words text-2xl font-bold"
          ></h2>
          <p
            id="login-name"
            class="mt-1 break-words text-sm text-slate-500"
          ></p>
        </div>
      </div>

      <p
        id="bio"
        class="mt-6 whitespace-pre-wrap break-words text-sm leading-7 text-slate-600"
      ></p>

      <dl class="mt-6 grid grid-cols-2 gap-4">
        <div class="rounded-xl bg-indigo-50 p-4 text-center">
          <dt class="text-xs font-bold text-slate-500">
            フォロワー
          </dt>
          <dd
            id="followers"
            class="mt-2 text-2xl font-bold text-indigo-600"
          ></dd>
        </div>

        <div class="rounded-xl bg-indigo-50 p-4 text-center">
          <dt class="text-xs font-bold text-slate-500">
            公開リポジトリ
          </dt>
          <dd
            id="public-repos"
            class="mt-2 text-2xl font-bold text-indigo-600"
          ></dd>
        </div>
      </dl>

      <a
        id="profile-link"
        target="_blank"
        rel="noopener noreferrer"
        class="mt-6 block rounded-lg bg-slate-800 px-4 py-3 text-center text-sm font-bold text-white transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-600"
      >
        GitHubでプロフィールを見る（別タブ）
      </a>
    </section>
  </main>

  <script>
    const form = document.getElementById("search-form");
    const usernameInput = document.getElementById("username");
    const searchButton = document.getElementById("search-button");
    const message = document.getElementById("message");
    const userCard = document.getElementById("user-card");

    const avatar = document.getElementById("avatar");
    const displayName = document.getElementById("display-name");
    const loginName = document.getElementById("login-name");
    const bio = document.getElementById("bio");
    const followers = document.getElementById("followers");
    const publicRepos = document.getElementById("public-repos");
    const profileLink = document.getElementById("profile-link");

    let isLoading = false;

    // メッセージと文字色をまとめて変更する
    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError
        ? "mt-4 text-sm font-bold text-red-600"
        : "mt-4 text-sm text-slate-500";
    }

    // asyncを付けることで、関数内でawaitが使える
    form.addEventListener("submit", async (event) => {
      // フォーム送信によるページのリロードを止める
      event.preventDefault();

      // 通信中の重複リクエストを防ぐ
      if (isLoading) {
        return;
      }

      const username = usernameInput.value.trim();

      // 前回の検索結果を隠す
      userCard.hidden = true;

      // 空欄ならAPIにリクエストを送らない
      if (username === "") {
        showMessage("GitHubのユーザー名を入力してください。", true);
        usernameInput.focus();
        return;
      }

      isLoading = true;
      searchButton.disabled = true;
      usernameInput.disabled = true;
      searchButton.textContent = "読み込み中...";
      showMessage("読み込み中...");

      try {
        // 入力をURLの一部として安全に扱うためエンコードする
        const url =
          `https://api.github.com/users/${encodeURIComponent(username)}`;

        // awaitでレスポンスが届くのを待つ
        const response = await fetch(url, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });

        // fetchは404などでも自動ではcatchに進まないため、
        // response.okでHTTPレスポンスの成功・失敗を確認する
        if (!response.ok) {
          if (response.status === 404) {
            showMessage("ユーザーが見つかりませんでした", true);
          } else if (
            response.status === 403 ||
            response.status === 429
          ) {
            showMessage(
              "アクセスが制限されています。時間をおいて再度お試しください。",
              true
            );
          } else {
            showMessage(
              `情報を取得できませんでした（エラー：${response.status}）。`,
              true
            );
          }

          return;
        }

        // JSONをJavaScriptのオブジェクトに変換する
        const user = await response.json();

        // DevToolsのConsoleを開き、プロパティと値を確認する
        console.log("GitHub APIから取得したデータ:", user);

        // APIの文字列はtextContentで表示する
        // 名前・bioが未設定の場合は代わりの表示を用意する
        displayName.textContent = user.name || user.login;
        loginName.textContent = `@${user.login}`;
        bio.textContent = user.bio || "自己紹介は未設定です。";

        avatar.src = user.avatar_url;
        avatar.alt = `${user.login}のアバター画像`;

        followers.textContent = user.followers.toLocaleString("ja-JP");
        publicRepos.textContent =
          user.public_repos.toLocaleString("ja-JP");

        profileLink.href = user.html_url;

        userCard.hidden = false;
        showMessage(`${user.login}の情報を取得しました。`);
      } catch (error) {
        // ネットワーク障害やJSONの読み取り失敗などを処理する
        console.error("ユーザー情報の取得に失敗しました:", error);

        showMessage(
          "通信に失敗しました。インターネット接続を確認して再度お試しください。",
          true
        );
      } finally {
        // 成功・失敗・途中のreturnに関係なく入力とボタンを戻す
        isLoading = false;
        searchButton.disabled = false;
        usernameInput.disabled = false;
        searchButton.textContent = "検索する";
      }
    });
  </script>
</body>
</html>
